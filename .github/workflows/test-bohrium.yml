name: Test Bohrium

'on':
  push:
    branches-ignore:
      - 'copilot/**'
      - 'dependabot/**'
      - 'pre-commit-ci-update-config'
  # Secret-backed pull request tests must be started by a maintainer after
  # reviewing an exact commit. This keeps untrusted workflow changes out of
  # the privileged pull_request_target context.
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number containing the reviewed commit
        required: true
        type: string
      reviewed_sha:
        description: Full 40-character head SHA reviewed by the maintainer
        required: true
        type: string

permissions: {}

jobs:
  verify_reviewed_commit:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'deepmodeling' && github.event_name == 'workflow_dispatch'
    permissions:
      pull-requests: read
    outputs:
      head_repository: ${{ steps.verify.outputs.head_repository }}
      reviewed_sha: ${{ steps.verify.outputs.reviewed_sha }}
    steps:
    - name: Verify the reviewed pull request commit
      id: verify
      env:
        GH_TOKEN: ${{ github.token }}
        PULL_REQUEST: ${{ inputs.pull_request }}
        REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      run: |
        if [[ ! "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]]; then
          echo "pull_request must be a positive integer" >&2
          exit 1
        fi
        if [[ ! "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "reviewed_sha must be a full lowercase commit SHA" >&2
          exit 1
        fi

        IFS=$'\t' read -r head_repository current_sha < <(
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}" \
            --jq '[.head.repo.full_name, .head.sha] | @tsv'
        )
        if [[ -z "$head_repository" ]]; then
          echo "Pull request head repository is unavailable" >&2
          exit 1
        fi
        if [[ "$current_sha" != "$REVIEWED_SHA" ]]; then
          echo "Pull request head changed: reviewed $REVIEWED_SHA, current $current_sha" >&2
          exit 1
        fi

        echo "head_repository=$head_repository" >> "$GITHUB_OUTPUT"
        echo "reviewed_sha=$REVIEWED_SHA" >> "$GITHUB_OUTPUT"

  test:
    needs: verify_reviewed_commit
    if: >-
      always() &&
      github.repository_owner == 'deepmodeling' &&
      (github.event_name == 'push' || needs.verify_reviewed_commit.result == 'success')
    runs-on: ubuntu-latest
    environment: bohrium
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v7
      with:
        # Pin manual runs to the reviewed commit so a later force-push cannot
        # change the code that receives access to the Bohrium environment.
        repository: ${{ github.event_name == 'workflow_dispatch' && needs.verify_reviewed_commit.outputs.head_repository || github.repository }}
        ref: ${{ github.event_name == 'workflow_dispatch' && needs.verify_reviewed_commit.outputs.reviewed_sha || github.sha }}
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
    - run: pip install uv
    - run: uv pip install --system .[bohrium] coverage
    - name: Test
      run: coverage run --source=./dpdispatcher -m unittest -v tests/test_run_submission_bohrium.py && coverage report
      env:
        DPDISPATCHER_TEST: bohrium
        BOHRIUM_EMAIL: ${{ secrets.BOHRIUM_EMAIL }}
        BOHRIUM_PASSWORD: ${{ secrets.BOHRIUM_PASSWORD }}
        BOHRIUM_PROJECT_ID: ${{ secrets.BOHRIUM_PROJECT_ID }}
        BOHRIUM_ACCESS_KEY: ${{ secrets.BOHRIUM_ACCESS_KEY }}
    - uses: codecov/codecov-action@v7
      with:
        use_oidc: true
